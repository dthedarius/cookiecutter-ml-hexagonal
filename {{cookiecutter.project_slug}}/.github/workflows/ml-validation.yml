name: ML Validation Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'pipelines/**'
      - 'configs/**'

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Validate data schemas
        run: |
          if [ -d "data/raw" ] && [ "$(ls -A data/raw/*.json 2>/dev/null)" ]; then
            PYTHONPATH=. uv run python -m pipelines.data_validation.validate
          else
            echo "No data files to validate"
          fi

  validate-configs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Validate experiment configs
        run: |
          python -c "
          import yaml
          from pathlib import Path
          for f in Path('configs/experiment').glob('*.yaml'):
              with f.open() as fh:
                  config = yaml.safe_load(fh)
              print(f'OK: {f.name} - {config[\"name\"]}')
          "
